<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#a855f7" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Graph Connecting Lines (Edges) -->
  <g stroke-width="10" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="120" x2="120" y2="280" stroke="#a855f7"/>
    <line x1="256" y1="120" x2="392" y2="280" stroke="#a855f7"/>
    <line x1="120" y1="280" x2="256" y2="400" stroke="#38bdf8"/>
    <line x1="392" y1="280" x2="256" y2="400" stroke="#34d399"/>
    <line x1="120" y1="280" x2="392" y2="280" stroke="#fbbf24" stroke-dasharray="16 12"/>
  </g>

  <!-- Central Pulsing Network Ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#a855f7" stroke-opacity="0.2" stroke-width="4" stroke-dasharray="8 8"/>

  <!-- Graph Nodes -->
  <!-- Top Node (Candidate) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="120" r="42" fill="url(#nodeGrad1)"/>
    <circle cx="256" cy="120" r="22" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Left Node (Skill) -->
  <g filter="url(#glow)">
    <circle cx="120" cy="280" r="36" fill="url(#nodeGrad2)"/>
    <circle cx="120" cy="280" r="18" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Right Node (Project) -->
  <g filter="url(#glow)">
    <circle cx="392" cy="280" r="36" fill="url(#nodeGrad3)"/>
    <circle cx="392" cy="280" r="18" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Bottom Node (Role) -->
  <g filter="url(#glow)">
    <circle cx="256" cy="400" r="44" fill="url(#nodeGrad4)"/>
    <circle cx="256" cy="400" r="22" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
